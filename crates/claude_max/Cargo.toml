[package]
name = "claude_max"
version = "0.1.0"
edition = "2021"
publish.workspace = true
license.workspace = true
description = "Direct Anthropic /v1/messages client using Claude Max OAuth tokens."

[dependencies]
async-stream.workspace = true
base64.workspace = true
chrono.workspace = true
dirs.workspace = true
futures.workspace = true
rand.workspace = true
reqwest.workspace = true
reqwest-eventsource.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
thiserror.workspace = true
url.workspace = true

# Bin-only dependencies. Pulled in unconditionally because cargo doesn't
# distinguish bin deps from lib deps; the tradeoff is small (~3 crates).
clap.workspace = true
rustls = { workspace = true, features = ["ring"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }

[dev-dependencies]
tempfile.workspace = true

[[bin]]
name = "claude-max"
path = "src/bin/claude_max.rs"
